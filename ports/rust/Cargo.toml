[package]
name = "lombokalgoritma"
version = "0.1.0"
edition = "2021"
authors = ["codinglombok <codinglombok@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/codinglombok/LombokAlgoritma"
description = "Comprehensive algorithm library — 160+ algorithms, zero external deps"
keywords = ["algorithm","sort","graph","cryptography","simd"]
categories = ["algorithms","cryptography","data-structures","no-std"]
readme = "../../README.md"

[features]
default = ["std","simd"]
std     = []
simd    = []
no_std  = []
ecc     = []
wasm    = ["wasm-bindgen"]
crypto  = []
full    = ["std","simd","ecc","crypto"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sort_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
