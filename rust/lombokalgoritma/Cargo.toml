[package]
name = "lombokalgoritma"
description = "LombokAlgoritma — deterministic, zero-dependency algorithm library (sort, search, math, strings, hashes, data structures, graphs, ML, geometry, compression, PRNG); no_std + alloc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["algorithm", "graph", "sort", "hash", "no-std"]
categories = ["algorithms", "data-structures", "no-std"]

[features]
default = ["std"]
# `std` only adds std-specific conveniences; the core is `no_std` + `alloc`.
std = []

[dependencies]
# Zero runtime dependencies.

[lints]
workspace = true
