coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
  precision: 2
  round: down
  range: "70...100"

ignore:
  - "**/dist/**"
  - "typescript/tests/**"
  - "typescript/scripts/**"
  - "**/*.d.ts"
  - "**/index.ts"
  - "scripts/**"
  - "docs/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
