[build-system]
requires      = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name        = "lombokalgoritma"
version     = "0.1.0"
description = "Comprehensive multi-language algorithm library — 160+ algorithms, zero external deps. Python port of LombokAlgoritma."
readme      = "ports/python/README.md"
license     = { spdx = "Apache-2.0" }
authors     = [{ name = "codinglombok", email = "codinglombok@gmail.com" }]
requires-python = ">=3.10"
keywords    = [
  "algorithm", "algorithms", "sort", "search", "graph",
  "data-structure", "cryptography", "machine-learning",
  "compression", "geometry", "string-algorithms",
  "zero-dependency", "lombok-ecosystem"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

# Zero external runtime dependencies (pure Python)
dependencies = []

[project.optional-dependencies]
# Optional: NumPy acceleration for ML/vector ops (not required)
numpy = ["numpy>=1.26"]
# Optional: LombokECC verified output
ecc   = ["lombokecc>=0.1.0"]
# Development
dev   = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "hypothesis>=6.100",
]

[project.urls]
Homepage      = "https://github.com/codinglombok/LombokAlgoritma"
Repository    = "https://github.com/codinglombok/LombokAlgoritma"
Documentation = "https://github.com/codinglombok/LombokAlgoritma/tree/main/docs"
"Bug Tracker" = "https://github.com/codinglombok/LombokAlgoritma/issues"
Changelog     = "https://github.com/codinglombok/LombokAlgoritma/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ports/python/lombokalgoritma"]

[tool.hatch.build.targets.sdist]
include = [
  "/ports/python/lombokalgoritma",
  "/ports/python/tests",
  "/tests/vectors",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths     = ["ports/python/tests"]
addopts       = "-v --tb=short --cov=lombokalgoritma --cov-report=term-missing --cov-report=xml"
required_plugins = ["pytest-cov"]

[tool.mypy]
python_version      = "3.10"
strict              = true
warn_return_any     = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["S101"]   # allow assert in tests

[tool.coverage.run]
source   = ["lombokalgoritma"]
omit     = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
