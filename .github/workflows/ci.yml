# LombokAlgoritma — CI
# SPDX-License-Identifier: Apache-2.0 OR MIT
# One job per language folder (typescript/ rust/ go/ python/ php/ cpp/ perl/ …). The five conformant
# ports each upload their vector-runner output; `vectors-crosscheck` requires all five to be
# byte-identical (SPEC_LombokAlgoritma_v0.2.0 §1). Jobs marked "experimental" are not yet verified
# and do not gate merges; `ci-pass` is the required status check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VECTORS: vectors/lombokalgoritma-vectors-v1.json

jobs:
  vectors-file:
    name: Vector file integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: SHA-256 matches vectors/SHA256SUMS (cited by SPEC)
        run: cd vectors && sha256sum -c SHA256SUMS

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run counts:check
      - run: npm run vectors:check
      - run: npm test -- --coverage
      - run: npm run build
      - name: Every path in package.json "exports" exists
        run: |
          node -e '
            const p = require("./package.json"); const fs = require("fs"); let miss = 0;
            for (const [k, v] of Object.entries(p.exports))
              for (const f of typeof v === "string" ? [v] : Object.values(v))
                if (!fs.existsSync(f)) { console.error("missing", k, f); miss++; }
            process.exit(miss ? 1 : 0);'
      - run: npm pack --dry-run
      - run: mkdir -p ../out && npm run vectors:run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.node == '22'
        with:
          name: vectors-typescript
          path: out/typescript.txt
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node == '22'
        with:
          flags: typescript
          files: typescript/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: rust
      - uses: taiki-e/install-action@c99cc51b309eee71a866715cfa08c922f11cf898 # v2.56.19
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p lombokalgoritma --no-default-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p lombokalgoritma --no-default-features
      - name: Coverage ≥ 90 % (lines)
        run: cargo llvm-cov -p lombokalgoritma -p lombokalgoritma-vectors --fail-under-lines 90 --summary-only
      - run: mkdir -p ../out && cargo run -q -p lombokalgoritma-vectors -- ../$VECTORS > ../out/rust.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vectors-rust
          path: out/rust.txt

  rust-msrv:
    name: Rust MSRV (1.75)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: rust
      - run: cargo build -p lombokalgoritma -p lombokalgoritma-capi -p lombokalgoritma-vectors
      - run: cargo test -p lombokalgoritma

  rust-targets:
    name: Rust ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            build: cargo build -p lombokalgoritma --no-default-features --target thumbv7em-none-eabihf --release
          - target: wasm32-unknown-unknown
            build: cargo build -p lombokalgoritma-wasm -p lombokalgoritma --no-default-features --target wasm32-unknown-unknown --release
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - run: ${{ matrix.build }}

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21", "1.22", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out .
      - name: Coverage ≥ 90 % (library package)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage $pct %"; awk -v p="$pct" 'BEGIN { exit (p >= 90 ? 0 : 1) }'
      - run: go test -race -count=1 ./...
      - run: mkdir -p ../out && go run ./cmd/vectors ../$VECTORS > ../out/go.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.go == 'stable'
        with:
          name: vectors-go
          path: out/go.txt

  go-lint:
    # golangci-lint must be built with a Go at least as new as the one type-checking the code, so the
    # linter and the toolchain are pinned together instead of following "stable".
    name: Go lint (golangci-lint v2.5.0, Go 1.25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.mod
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.5.0
          working-directory: go

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./python[dev]"
      - run: ruff check python
      - run: ruff format --check python
      - run: mypy --strict python/lombokalgoritma
      - run: cd python && pytest
      - run: mkdir -p out && python -m lombokalgoritma._vectors $VECTORS > out/python.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.12'
        with:
          name: vectors-python
          path: out/python.txt

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # 2.34.1
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring
          coverage: pcov
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpcs --standard=PSR12 php/src php/tests php/bin
      - run: vendor/bin/phpstan analyse -c php/phpstan.neon --no-progress
      - run: vendor/bin/phpunit -c php/phpunit.xml --coverage-text --only-summary-for-coverage-text | tee phpunit.txt
      - name: Coverage ≥ 90 % (lines)
        run: |
          pct=$(grep -m1 -E '^\s*Lines:' phpunit.txt | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "coverage $pct %"; awk -v p="$pct" 'BEGIN { exit (p >= 90 ? 0 : 1) }'
      - run: mkdir -p out && php php/bin/vectors.php $VECTORS > out/php.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.php == '8.3'
        with:
          name: vectors-php
          path: out/php.txt

  vectors-crosscheck:
    name: Vectors byte-identical in 5 ports
    runs-on: ubuntu-latest
    needs: [typescript, rust, go, python, php]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vectors-*
          merge-multiple: true
          path: out
      - name: cmp every port against the TypeScript reference
        run: |
          cd out && sha256sum ./*.txt
          for p in rust go python php; do cmp typescript.txt "$p.txt"; done

  cpp:
    name: C++20 (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  perl:
    name: Perl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: prove -I perl/lib -r perl/t

  # ── Not yet verified (see README status table) — reported, non-blocking ─────────────────────
  experimental:
    name: Experimental ${{ matrix.lang }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: java
            os: ubuntu-latest
          - lang: dotnet
            os: ubuntu-latest
          - lang: swift
            os: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.lang == 'java'
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - if: matrix.lang == 'java'
        run: mvn -B --no-transfer-progress -f java/pom.xml test
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.lang == 'dotnet'
        with:
          dotnet-version: "8.0.x"
      - if: matrix.lang == 'dotnet'
        run: dotnet test csharp/tests --configuration Release
      - if: matrix.lang == 'swift'
        run: swift test

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    if: always()
    needs: [vectors-file, typescript, rust, rust-msrv, rust-targets, go, go-lint, python, php, vectors-crosscheck, cpp, perl]
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJson(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "CI FAILED"; exit 1
          fi
