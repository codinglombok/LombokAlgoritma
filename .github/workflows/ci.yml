# LombokAlgoritma — CI
# SPDX-License-Identifier: Apache-2.0 OR MIT
# One job per language that has code. Jobs marked "experimental" are not yet verified and do not
# gate merges (continue-on-error); the `ci-pass` job is the required status check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run counts:check
      - run: npm test -- --coverage
      - run: npm run build
      - name: Every path in package.json "exports" exists
        run: |
          node -e '
            const p = require("./package.json"); const fs = require("fs"); let miss = 0;
            for (const [k, v] of Object.entries(p.exports))
              for (const f of typeof v === "string" ? [v] : Object.values(v))
                if (!fs.existsSync(f)) { console.error("missing", k, f); miss++; }
            process.exit(miss ? 1 : 0);'
      - run: npm pack --dry-run
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node == '22'
        with:
          flags: typescript
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p lombokalgoritma --no-default-features

  rust-msrv:
    name: Rust MSRV (1.75)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: rust
      - run: cargo build --workspace
      - run: cargo test -p lombokalgoritma

  rust-targets:
    name: Rust ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            build: cargo build -p lombokalgoritma --no-default-features --target thumbv7em-none-eabihf
          - target: wasm32-unknown-unknown
            build: cargo build -p lombokalgoritma-wasm -p lombokalgoritma --no-default-features --target wasm32-unknown-unknown --release
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - run: ${{ matrix.build }}

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21", "1.22", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check ports/python
      - run: ruff format --check ports/python
      - run: mypy ports/python/lombokalgoritma
      - run: pytest

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # 2.34.1
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpunit --no-coverage

  cpp:
    name: C++20 (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S ports/cpp -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  perl:
    name: Perl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: prove -I ports/perl/lib -r ports/perl/t

  # ── Not yet verified (see README status table) — reported, non-blocking ─────────────────────
  experimental:
    name: Experimental ${{ matrix.lang }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: java
            os: ubuntu-latest
          - lang: dotnet
            os: ubuntu-latest
          - lang: swift
            os: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.lang == 'java'
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - if: matrix.lang == 'java'
        run: mvn -B --no-transfer-progress test
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.lang == 'dotnet'
        with:
          dotnet-version: "8.0.x"
      - if: matrix.lang == 'dotnet'
        run: dotnet test ports/csharp/tests --configuration Release
      - if: matrix.lang == 'swift'
        run: swift test

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    if: always()
    needs: [typescript, rust, rust-msrv, rust-targets, go, python, php, cpp, perl]
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJson(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "CI FAILED"; exit 1
          fi
