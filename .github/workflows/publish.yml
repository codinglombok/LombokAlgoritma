# LombokAlgoritma — Publish to registries
# SPDX-License-Identifier: Apache-2.0 OR MIT
# Called by release-please.yml; can also be run manually (workflow_dispatch) for an existing tag.
# The version always comes from the git TAG, never from a manifest (ADR-011).
name: Publish to registries

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      targets:
        description: comma-separated subset of npm,pypi,packagist,crates,go
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag, e.g. v0.2.0, rust-v0.2.0 or go/v0.2.0
        required: true
      targets:
        description: comma-separated subset of npm,pypi,packagist,crates,go
        required: true
        default: npm,pypi,packagist

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v="${TAG##*/}"; v="${v#rust-}"; v="${v#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad tag $TAG"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    if: contains(inputs.targets, 'npm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - name: Quality gate
        working-directory: typescript
        run: npm run typecheck && npm run lint && npm test && npm run vectors:check && npm run build
      - name: package.json version must equal tag
        working-directory: typescript
        run: test "$(node -p 'require("./package.json").version')" = "${{ needs.version.outputs.version }}"
      - name: Copy README / licenses / CHANGELOG into the package
        working-directory: typescript
        run: node scripts/copy-meta.mjs
      - run: npm publish --provenance --access public --ignore-scripts
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: version
    if: contains(inputs.targets, 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./python[dev]" build
      - run: cd python && pytest
      - run: python -m build python
      - name: wheel version must equal tag
        run: ls python/dist/*-${{ needs.version.outputs.version }}-py3-none-any.whl
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: python/dist

  packagist:
    needs: version
    if: contains(inputs.targets, 'packagist')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist (reads composer.json at the tag)
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -fsS -XPOST -H 'content-type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/codinglombok/LombokAlgoritma"}}'

  crates:
    needs: version
    if: contains(inputs.targets, 'crates')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: cargo test --workspace
      - name: workspace version must equal tag
        run: grep -q "^version = \"${{ needs.version.outputs.version }}\"" Cargo.toml
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p lombokalgoritma
          cargo publish -p lombokalgoritma-capi
          cargo publish -p lombokalgoritma-wasm

  go:
    needs: version
    if: contains(inputs.targets, 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - name: Warm proxy.golang.org / pkg.go.dev
        run: |
          cd "$(mktemp -d)" && go mod init probe
          GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
            go get "github.com/codinglombok/lombokalgoritma/go@v${{ needs.version.outputs.version }}"
