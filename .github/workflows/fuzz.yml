name: Fuzz Testing

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Nightly 02:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration per target (seconds)"
        default: "600"

jobs:
  fuzz-rust:
    name: Rust Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fuzz_sort
          - fuzz_string_parsers
          - fuzz_compression
          - fuzz_crypto
          - fuzz_graph
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Run fuzz target
        run: |
          DURATION=${{ inputs.duration || '600' }}
          cd ports/rust
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=$DURATION -max_len=65536
      - name: Upload artifacts if crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ports/rust/fuzz/artifacts/
