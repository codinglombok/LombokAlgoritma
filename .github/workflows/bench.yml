name: Benchmark Regression

on:
  pull_request:
    branches: [main]

jobs:
  bench-ts:
    name: TypeScript Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci && npm run build
      - name: Run benchmarks (PR branch)
        run: npm run bench -- --reporter=json > bench-pr.json
      - name: Checkout main for baseline
        run: git checkout main
      - run: npm ci && npm run build
      - name: Run benchmarks (main)
        run: npm run bench -- --reporter=json > bench-main.json
      - name: Compare (fail if >10% regression)
        run: node scripts/bench_compare.js bench-main.json bench-pr.json

  bench-rust:
    name: Rust Criterion Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Criterion benchmarks
        run: cargo bench --all-features 2>&1 | tee bench-output.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: rust-bench-results
          path: target/criterion/
